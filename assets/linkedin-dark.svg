<svg xmlns="http://www.w3.org/2000/svg" width="275" height="52" viewBox="0 0 275 52" role="img">
<style>
.sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="273" height="50" rx="12"/></clipPath>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1c2840"/></pattern>
</defs>
<rect x="1" y="1" width="273" height="50" rx="12" fill="url(#bg)"/>
<g clip-path="url(#frame)">
<rect x="0" y="0" width="5" height="52" fill="url(#accent)"/>
<text x="30" y="31.5" class="mono" font-size="15" font-weight="700" fill="#e6edf3">Connect on LinkedIn</text>
<text x="251.0" y="33.0" text-anchor="end" class="sans" font-size="20" fill="#2dd4bf">↗</text>
</g>
<rect x="1" y="1" width="273" height="50" rx="12" fill="none" stroke="#263248"/>
</svg>
