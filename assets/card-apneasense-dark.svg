<rect x="0" y="0" width="600" height="5" fill="url(#accent)" rx="2"/>
<text x="36" y="56" class="mono" font-size="13" letter-spacing="2" fill="#2dd4bf">MULTIMODAL · NUS-ISS 2026</text>
<text x="36" y="96" class="sans" font-size="30" font-weight="700" fill="#e6edf3">ApneaSense</text>
<text x="564" y="96" text-anchor="end" class="sans" font-size="26" fill="#8b98a9">↗</text>
<text x="36" y="140" class="sans" font-size="19" fill="#8b98a9">Sleep apnea screening from one overnight video:</text><text x="36" y="168" class="sans" font-size="19" fill="#8b98a9">audio spectrogram classification and self-attention</text><text x="36" y="196" class="sans" font-size="19" fill="#8b98a9">fusion of RGB, depth and pose for sleep posture.</text><text x="36" y="224" class="sans" font-size="19" fill="#8b98a9">Shipped as a Streamlit app.</text>
