<svg xmlns="http://www.w3.org/2000/svg" width="600" height="312" viewBox="0 0 600 312" role="img">
<style>
.sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fb"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d9488"/><stop offset=".5" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<clipPath id="frame"><rect x="1" y="1" width="598" height="310" rx="18"/></clipPath>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e3e8f0"/></pattern>
</defs>
<rect x="1" y="1" width="598" height="310" rx="18" fill="url(#bg)"/>
<g clip-path="url(#frame)">
<rect x="0" y="0" width="600" height="5" fill="url(#accent)" rx="2"/>
<text x="36" y="56" class="mono" font-size="13" letter-spacing="2" fill="#0d9488">MULTIMODAL · NUS-ISS 2026</text>
<text x="36" y="96" class="sans" font-size="30" font-weight="700" fill="#1f2328">ApneaSense</text>
<text x="564" y="96" text-anchor="end" class="sans" font-size="26" fill="#59636e">↗</text>
<text x="36" y="140" class="sans" font-size="19" fill="#59636e">Sleep apnea screening from one overnight video:</text><text x="36" y="168" class="sans" font-size="19" fill="#59636e">audio spectrogram classification and self-attention</text><text x="36" y="196" class="sans" font-size="19" fill="#59636e">fusion of RGB, depth and pose for sleep posture.</text><text x="36" y="224" class="sans" font-size="19" fill="#59636e">Shipped as a Streamlit app.</text>
<rect x="36.0" y="254" width="76.6" height="28" rx="14.0" fill="#f6f8fa" stroke="#d0d7de"/><text x="74.3" y="272.6" text-anchor="middle" class="mono" font-size="13" fill="#1f2328">PyTorch</text><rect x="120.6" y="254" width="84.4" height="28" rx="14.0" fill="#f6f8fa" stroke="#d0d7de"/><text x="162.8" y="272.6" text-anchor="middle" class="mono" font-size="13" fill="#1f2328">ResNet18</text><rect x="213.0" y="254" width="107.8" height="28" rx="14.0" fill="#f6f8fa" stroke="#d0d7de"/><text x="266.9" y="272.6" text-anchor="middle" class="mono" font-size="13" fill="#1f2328">YOLOv8-pose</text><rect x="328.8" y="254" width="131.2" height="28" rx="14.0" fill="#f6f8fa" stroke="#d0d7de"/><text x="394.4" y="272.6" text-anchor="middle" class="mono" font-size="13" fill="#1f2328">Depth Anything</text>
</g>
<rect x="1" y="1" width="598" height="310" rx="18" fill="none" stroke="#d0d7de"/>
</svg>
