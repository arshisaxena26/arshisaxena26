<text x="600.0" y="31" text-anchor="middle" class="mono" font-size="14" fill="#8b98a9">~/arshi — how I build</text>
<text x="56" y="104" class="mono l0" font-size="17" fill="#e6edf3"><tspan fill="#2dd4bf">$</tspan> evals run <tspan fill="#a78bfa">--suite</tspan> arshi</text><text x="56" y="172" class="mono l1" font-size="17" fill="#e6edf3"><tspan fill="#2dd4bf">✓</tspan> <tspan font-weight="700">the model is the easy part</tspan><tspan x="382.4" fill="#8b98a9"># so I build the system around it</tspan></text><text x="56" y="206" class="mono l2" font-size="17" fill="#e6edf3"><tspan fill="#2dd4bf">✓</tspan> <tspan font-weight="700">context is engineered</tspan><tspan x="382.4" fill="#8b98a9"># hybrid search, reranking, metadata filters</tspan></text><text x="56" y="240" class="mono l3" font-size="17" fill="#e6edf3"><tspan fill="#2dd4bf">✓</tspan> <tspan font-weight="700">harness over hope</tspan><tspan x="382.4" fill="#8b98a9"># schema-constrained output, deterministic checks</tspan></text><text x="56" y="274" class="mono l4" font-size="17" fill="#e6edf3"><tspan fill="#2dd4bf">✓</tspan> <tspan font-weight="700">evals before vibes</tspan><tspan x="382.4" fill="#8b98a9"># golden sets and LLM-as-judge, gated in CI</tspan></text><text x="56" y="308" class="mono l5" font-size="17" fill="#e6edf3"><tspan fill="#2dd4bf">✓</tspan> <tspan font-weight="700">confidence from log-probs</tspan><tspan x="382.4" fill="#8b98a9"># not the model's self-report</tspan></text><text x="56" y="342" class="mono l6" font-size="17" fill="#e6edf3"><tspan fill="#2dd4bf">✓</tspan> <tspan font-weight="700">humans confirm what matters</tspan><tspan x="382.4" fill="#8b98a9"># human-in-the-loop by design</tspan></text><text x="56" y="376" class="mono l7" font-size="17" fill="#e6edf3"><tspan fill="#2dd4bf">✓</tspan> <tspan font-weight="700">secure by default</tspan><tspan x="382.4" fill="#8b98a9"># OWASP LLM Top 10 guardrails, SAST in CI</tspan></text><text x="56" y="410" class="mono l8" font-size="17" fill="#e6edf3"><tspan fill="#2dd4bf">✓</tspan> <tspan font-weight="700">ship it</tspan><tspan x="382.4" fill="#8b98a9"># production users, not notebooks</tspan></text><g class="l9"><rect class="cur" x="423.2" y="464" width="10.2" height="19" fill="#2dd4bf"/></g><text x="56" y="478" class="mono l9" font-size="17" fill="#e6edf3"><tspan fill="#2dd4bf" font-weight="700">8/8 passed</tspan><tspan fill="#8b98a9"> · 0 vibes-based releases</tspan></text>
</g>
